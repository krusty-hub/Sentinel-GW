global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "sentinel_gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "gateway-node-1:8080"
          - "gateway-node-2:8080"
          - "gateway-node-3:8080"
        labels:
          cluster: "sentinel-cluster-prod"
