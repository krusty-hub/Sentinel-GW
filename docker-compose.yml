version: '3.8'

services:
  nginx-lb:
    image: nginx:alpine
    container_name: sentinel-nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-node-1
      - gateway-node-2
      - gateway-node-3
    networks:
      - sentinel-net

  gateway-node-1:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: sentinel-node-1
    environment:
      - GATEWAY_NODE_ID=gateway-node-1
      - TOTAL_NODES=3
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - CONFIG_PATH=/app/config/config.yaml
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
    depends_on:
      - redis
      - mock-upstream
    networks:
      - sentinel-net

  gateway-node-2:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: sentinel-node-2
    environment:
      - GATEWAY_NODE_ID=gateway-node-2
      - TOTAL_NODES=3
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - CONFIG_PATH=/app/config/config.yaml
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
    depends_on:
      - redis
      - mock-upstream
    networks:
      - sentinel-net

  gateway-node-3:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: sentinel-node-3
    environment:
      - GATEWAY_NODE_ID=gateway-node-3
      - TOTAL_NODES=3
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - CONFIG_PATH=/app/config/config.yaml
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
    depends_on:
      - redis
      - mock-upstream
    networks:
      - sentinel-net

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    networks:
      - sentinel-net

  mock-upstream:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: sentinel-mock-upstream
    command: ["node", "--loader", "tsx", "test/mock_upstream/upstream.ts"]
    environment:
      - PORT=4000
    networks:
      - sentinel-net

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge
